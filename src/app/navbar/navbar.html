<header class="new-navbar" [ngClass]="{ 'scrolled': isScrolled }">
  <!-- Desktop Navigation -->
  <div class="desktop-nav">
    <!-- Top Row -->
    <div class="top-row">
      <div class="logo-container">
        <img src="/images/logo.png" alt="Itrah logo" style="width: 90px;" />
        <!-- <span class="brand-name">Itrah</span> -->
      </div>
      <div class="cart-container">
        <div class="right-icons">
          <div class="cart-icon" (click)="onCartClick()">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="badge">{{ cartCount }}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Row -->
    <div class="bottom-row">
      <nav class="nav-links">
        <a (click)="goHome()" [ngClass]="{active: isActive('/')}">Home</a>
        <a (click)="goAbout()" [ngClass]="{active: isActive('/about')}">About</a>
        <a (click)="goCollections()" [ngClass]="{active: isActive('/collections')}">Collections</a>
        <a (click)="goContact()" [ngClass]="{active: isActive('/contact')}">Contact</a>
      </nav>
    </div>
  </div>

  <!-- Mobile Navigation -->
  <div class="mobile-nav">
    <div class="logo">
      <img src="/images/logo.png" alt="Itrah logo" style="width: 90px;" />
    </div>
  </div>
</header>

<!-- Bottom Navigation Bar -->
<div class="bottom-nav">
  <a (click)="goHome()" [class.active]="isActive('/')">
    <i class="fa-solid fa-house"></i>
    <span>Home</span>
  </a>
  <a (click)="goCollections()" [class.active]="isActive('/collections')">
    <i class="fa-solid fa-layer-group"></i>
    <span>Collections</span>
  </a>
  <a (click)="onTrackOrder()">
    <i class="fa-solid fa-truck"></i>
    <span>Track</span>
  </a>
  <a (click)="onCartClick()" class="cart-nav-item">
    <div class="cart-icon">
      <i class="fa-solid fa-cart-shopping"></i>
      <span class="badge">{{ cartCount }}</span>
    </div>
    <span>Cart</span>
  </a>
</div>

<div *ngIf="searchTerm && searchTerm.trim() !== ''" class="navbar-search-results">
  <section class="featured-products">
    <h2>Search Items</h2>
    <div class="products-grid four-in-row">
      <ng-container *ngIf="filteredProducts.length > 0; else noResults">
        <ng-container *ngFor="let product of filteredProducts">
          <div class="product-card">
            <img [src]="product.images[0]" [alt]="product.name" />
            <h3>{{ product.name }}</h3>
            <div class="product-pricing">
              <span class="price">{{ product.price }}</span>
              <span class="old" *ngIf="product.old">{{ product.old }}</span>
            </div>
            <button class="add-to-bag" (click)="addToCart(product)">Add to Cart</button>
          </div>
        </ng-container>
      </ng-container>
      <ng-template #noResults>
        <div class="no-results">No products found.</div>
      </ng-template>
    </div>
  </section>
</div>

<div *ngIf="showLoginPopup" class="login-popup-backdrop" (click)="closeLoginPopup()">
  <div class="login-popup" (click)="$event.stopPropagation()">
    <button class="close-btn" (click)="closeLoginPopup()">&times;</button>
    <h3>Login</h3>
    <form (submit)="onLoginSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" type="text" [(ngModel)]="loginUsername" name="username" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" [(ngModel)]="loginPassword" name="password" required />
      </div>
      <button type="submit" class="login-btn">Login</button>
    </form>
  </div>
</div>
