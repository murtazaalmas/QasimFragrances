<div class="love-container">
  <div class="couple-messages">
    <div class="love-message fahad-loves" style="--text-color: #e3f2fd; --heart-color: #64b5f6; --glow-color: #90caf9;">
      <h1>Fahad Loves Samra <span class="heart">💙</span></h1>
      <div class="hearts">
        <span>💙</span>
        <span>💠</span>
        <span>💎</span>
        <span>🔷</span>
        <span>💦</span>
      </div>
    </div>
    
    <div class="love-message samra-loves" style="--text-color: #ffebee; --heart-color: #ff4081; --glow-color: #ff80ab;">
      <h1>Samra Loves Fahad <span class="heart">❤️</span></h1>
      <div class="hearts">
        <span>💘</span>
        <span>💓</span>
        <span>💗</span>

        <span>❤️</span>
      </div>
    </div>
  </div>
</div>

<style>
  .love-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #a8edea, #fed6e3);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    box-sizing: border-box;
    padding: 20px;
  }

  .couple-messages {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 30px;
    width: 100%;
    max-width: 1800px;
    margin: 0 auto;
  }

  .love-message {
    text-align: center;
    color: #fff;
    padding: 2rem;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    flex: 1;
    min-width: 300px;
    max-width: 500px;
    transition: transform 0.3s ease;
  }

  .love-message:hover {
    transform: translateY(-10px);
  }

  .love-message h1 {
    font-size: 3.5rem;
    margin: 0 0 1.5rem 0;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    /* font-family: 'Brush Script MT', cursive, sans-serif; */
    animation: glow 2s ease-in-out infinite alternate;
    color: var(--text-color, #fff);
  }

  /* Style for Samra's message */
  .samra-loves {
    background: rgba(0, 0, 0, 0.2) !important;
  }

  .samra-loves .heart,
  .samra-loves .hearts span {
    color: var(--heart-color, #ff4081);
    text-shadow: 0 0 10px var(--glow-color, #ff80ab);
  }

  .samra-loves h1 {
    color: var(--heart-color, #ff4081);
  }

  @keyframes glow {
    from {
      text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px var(--glow-color, #e60073), 0 0 20px var(--glow-color, #e60073);
    }
    to {
      text-shadow: 0 0 10px #fff, 0 0 20px var(--glow-color, #ff4da6), 0 0 30px var(--glow-color, #ff4da6), 0 0 40px var(--glow-color, #ff4da6);
    }
  }

  @media (max-width: 768px) {
    .love-message h1 {
      font-size: 2.5rem;
    }
    .hearts {
      font-size: 2rem;
    }
  }

  .heart {
    display: inline-block;
    animation: pulse 1.5s infinite;
  }

  .hearts {
    font-size: 2.5rem;
    margin-top: 1.5rem;
    display: flex;
    justify-content: center;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .hearts span {
    animation: float 3s ease-in-out infinite;
    opacity: 0;
  }

  .hearts span:nth-child(1) { animation-delay: 0.2s; }
  .hearts span:nth-child(2) { animation-delay: 0.4s; }
  .hearts span:nth-child(3) { animation-delay: 0.6s; }
  .hearts span:nth-child(4) { animation-delay: 0.8s; }
  .hearts span:nth-child(5) { animation-delay: 1s; }

  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }

  @keyframes float {
    0% { 
      transform: translateY(0) rotate(0deg);
      opacity: 0;
    }
    20% { opacity: 1; }
    100% { 
      transform: translateY(-100px) rotate(360deg);
      opacity: 0;
    }
  }

  @keyframes glow {
    from {
      text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px #e60073, 0 0 20px #e60073;
    }
    to {
      text-shadow: 0 0 10px #fff, 0 0 20px #ff4da6, 0 0 30px #ff4da6, 0 0 40px #ff4da6;
    }
  }

  @media (max-width: 600px) {
    .love-message h1 {
      font-size: 2.5rem;
    }
    .hearts {
      font-size: 2rem;
    }
  }
</style>
